<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="/public/custom.css">
  <style>
    :root { --bg: #f5f5f4; --card: #fff; --text: #1c1917; --muted: #57534e; --accent: #0055d4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --card: #292524; --text: #f5f5f4; --muted: #d6d3d1; --accent: #6ea8ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 16px; background: var(--bg); color: var(--text);
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 440px; background: var(--card); border-radius: 12px;
           padding: 32px 28px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size: 1.35rem; margin: 0 0 12px; }
    p { margin: 0; color: var(--muted); }
    form { margin-top: 24px; }
    button { width: 100%; padding: 12px 16px; border: 0; border-radius: 8px; cursor: pointer;
             background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>{{ .Title }}</h1>
    <p>{{ .Message }}</p>
    {{ if .Action }}
    <form method="post" action="{{ .Action }}">
      <button type="submit">{{ .Button }}</button>
    </form>
    {{ end }}
  </main>
</body>
</html>
